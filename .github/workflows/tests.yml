name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_phase3b.txt
        pip install pytest pytest-cov pytest-asyncio

    - name: Lint with flake8
      run: |
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
      continue-on-error: true

    - name: Type check with mypy
      run: |
        pip install mypy
        mypy analyzer/ --ignore-missing-imports --no-error-summary
      continue-on-error: true

    - name: Run unit tests
      run: |
        pytest analyzer/ -v --tb=short --cov=analyzer --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

    - name: Generate coverage report
      run: |
        pip install coverage
        coverage report
        coverage html

    - name: Archive test results
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.python-version }}
        path: |
          htmlcov/
          .coverage
        retention-days: 30

  integration-test:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_phase3b.txt

    - name: Verify all analyzers load
      run: |
        python -c "
        from analyzer.news_analyzer import NewsAnalyzer
        from analyzer.technical_analyzer import TechnicalAnalyzer
        from analyzer.options_analyzer import OptionsAnalyzer
        from analyzer.market_analyzer import MarketAnalyzer
        from analyzer.strategy_selector import StrategySelector
        from analyzer.call_put_predictor import CallPutPredictor
        from analyzer.reasoning_generator import ReasoningGenerator

        print('Testing analyzer initialization...')
        news = NewsAnalyzer()
        technical = TechnicalAnalyzer()
        options = OptionsAnalyzer()
        market = MarketAnalyzer()
        strategy = StrategySelector()
        ml_model = CallPutPredictor()
        reasoning = ReasoningGenerator()

        print('✅ All analyzers initialized successfully')
        print('✅ System ready for deployment')
        "

    - name: Test FastAPI import
      run: |
        python -c "
        import sys
        try:
          from app import app
          print('✅ FastAPI application imports successfully')
        except ImportError as e:
          print(f'⚠️  FastAPI not installed (expected in CI): {e}')
          sys.exit(0)
        "
      continue-on-error: true
